        createdAt: {type: string, format: date-time, example: '2026-10-18T15:45:00Z'}
        readAt: {type: string, format: date-time, nullable: true, example: '2026-10-18T15:50:00Z'}
    NotificationList:
      type: object
      additionalProperties: false
