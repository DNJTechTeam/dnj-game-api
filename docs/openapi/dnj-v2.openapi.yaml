      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/ModerationMoment'}}
        pagination: {$ref: '#/components/schemas/ModerationPagination'}
    Moderation:
      type: object
      additionalProperties: false
      required: [momentId, action, publicationStatus, moderationStatus, rewardStatus, photoStatus, pointsAwarded]
      properties:
        momentId: {type: string, format: uuid}
        action: {type: string, enum: [deny_points, delete_photo]}
        publicationStatus: {type: string, enum: [private, public]}
        moderationStatus: {type: string, enum: [approved, rejected]}
        rewardStatus: {type: string, enum: [not_applicable, awarded, denied, reversed]}
        photoStatus: {type: string, enum: [available, deleted]}
        pointsAwarded: {type: integer}
    NotificationPreferences:
      type: object
      additionalProperties: false
      required: [momentModerationEnabled, pointsEnabled, announcementEnabled, updatedAt]
