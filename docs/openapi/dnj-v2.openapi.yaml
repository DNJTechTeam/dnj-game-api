        photoStatus: {type: string, enum: [available, deleted]}
        availableActions: {type: array, items: {type: string, enum: [deny_points, delete_photo]}}
    ModerationPagination:
      type: object
      additionalProperties: false
      required: [currentPage, hasNextPage, limit]
      properties:
        currentPage: {type: string}
