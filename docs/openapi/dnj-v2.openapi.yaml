        momentModerationEnabled: {type: boolean, description: Sempre true; não existe caminho de escrita para desabilitá-la.}
        pointsEnabled: {type: boolean}
        announcementEnabled: {type: boolean}
        updatedAt: {type: string, format: date-time, example: '2026-10-18T15:45:00Z'}
    UpdateNotificationPreferencesRequest:
      type: object
      additionalProperties: false
      properties:
        pointsEnabled: {type: boolean}
        announcementEnabled: {type: boolean}
    Notification:
      type: object
      additionalProperties: false
      required: [id, category, state, title, body, sourceType, createdAt]
      properties:
        id: {type: string, format: uuid}
