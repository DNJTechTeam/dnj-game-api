openapi: 3.0.3
info:
  title: DNJ Game API V2
  version: 2.7.0
  description: Contrato canônico da V2; somente operações implementadas e testadas são publicadas.
servers:
  - url: http://localhost:8081/v2
    description: Desenvolvimento local
tags:
  - name: Operations
  - name: Identity
  - name: Profile
  - name: Groups
  - name: Group invites
  - name: Spaces
  - name: Schedule
  - name: Activities
  - name: Favorites
  - name: Activity operations
  - name: Games
  - name: Rankings
  - name: Game participation
  - name: Game management
  - name: Installation administration
  - name: Media
  - name: Moments
  - name: Moderation
  - name: Notifications
  - name: Notification administration
paths:
  /healthcheck:
    get:
      tags: [Operations]
      operationId: getHealthcheck
      summary: Confirma que o processo HTTP está ativo
      responses:
        '200':
          description: Processo ativo
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthcheckResponse'}
  /readiness:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Confirma que a API e o banco estão prontos
      responses:
        '200':
          description: Dependências prontas
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadinessResponse'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /auth/google:
    post:
      tags: [Identity]
      operationId: authenticateWithGoogle
      summary: Valida um ID token Google e inicia uma sessão
      description: >-
        Valida assinatura, issuer, audience, expiração e email_verified. Uma
        conta nova permanece incompleta até receber CPF, telefone e grupo.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoogleAuthRequest'}
      responses:
        '200': {$ref: '#/components/responses/IdentitySession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/signup:
    post:
      tags: [Identity]
      operationId: signupWithEmail
      summary: Envia um código de 6 dígitos por email para cadastro sem Google
      description: >-
        Self-service — não depende de nenhum registro pré-existente (ao
        contrário do /v1/auth/onboarding). Sempre responde CODE_SENT, mesmo
        quando o email já possui conta, para não permitir enumeração. Um
        reenvio antes do cooldown responde 429.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailSignupRequest'}
      responses:
        '200':
          description: Código enviado (ou reenviado)
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailSignupResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/signup/verify:
    post:
      tags: [Identity]
      operationId: verifyEmailSignup
      summary: Confirma o código e inicia uma sessão
      description: >-
        Cria uma conta DEFAULT incompleta na primeira verificação deste
        email, ou vincula à conta já existente (Google ou um signup
        anterior) — mesmo formato de resposta do login Google, incluindo
        cookies de sessão.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerifyEmailSignupRequest'}
      responses:
        '200': {$ref: '#/components/responses/IdentitySession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/refresh:
    post:
      tags: [Identity]
      operationId: refreshIdentitySession
      summary: Rotaciona o refresh token e renova a sessão
      description: >-
        Requer os cookies refresh_token e csrf_token e o mesmo valor CSRF no
        header. Reuso de refresh token revoga toda a família.
      parameters:
        - {$ref: '#/components/parameters/CSRFHeader'}
      security:
        - refreshCookie: []
          csrfCookie: []
      responses:
        '200': {$ref: '#/components/responses/IdentitySession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/logout:
    post:
      tags: [Identity]
      operationId: logoutIdentitySession
      summary: Revoga a família da sessão atual e remove os cookies
      parameters:
        - {$ref: '#/components/parameters/CSRFHeader'}
      security:
        - refreshCookie: []
          csrfCookie: []
      responses:
        '200':
          description: Sessão revogada
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Set-Cookie: {$ref: '#/components/headers/SessionCookies'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogoutResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/session:
    get:
      tags: [Identity]
      operationId: getCurrentIdentitySession
      summary: Retorna o usuário e o estado atual do onboarding
      security:
        - bearerAuth: []
        - identityCookie: []
      responses:
        '200':
          description: Sessão atual
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentSessionResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/onboarding:
    patch:
      tags: [Identity]
      operationId: completeIdentityOnboarding
      summary: Completa CPF, telefone e grupo do perfil autenticado
      security:
        - bearerAuth: []
        - identityCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompleteOnboardingRequest'}
      responses:
        '200':
          description: Perfil completo
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentSessionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /users/me:
    get:
      tags: [Profile]
      operationId: getCurrentProfile
      summary: Retorna o perfil autenticado sem CPF integral ou hashes
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '200':
          description: Perfil atual
          content: {application/json: {schema: {$ref: '#/components/schemas/CurrentProfile'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      tags: [Profile]
      operationId: updateCurrentProfile
      summary: Edita somente nome e telefone móvel do perfil atual
      description: Email, CPF, identidade, papel, pontos e grupo são somente leitura nesta operação.
      security: [{bearerAuth: []}, {identityCookie: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateCurrentProfileRequest'}}}
      responses:
        '200': {description: Perfil atualizado, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentProfile'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /users/me/group:
    patch:
      tags: [Groups]
      operationId: updateCurrentUserGroup
      summary: Entra, troca ou sai do grupo atual
      security: [{bearerAuth: []}, {identityCookie: []}]
      requestBody: {$ref: '#/components/requestBodies/UpdateCurrentGroup'}
      responses:
        '200': {description: Perfil com grupo atualizado, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentProfile'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Groups]
      operationId: updateCurrentUserGroupCompatibility
      deprecated: true
      summary: Alias temporário compatível com o frontend atual
      security: [{bearerAuth: []}, {identityCookie: []}]
      requestBody: {$ref: '#/components/requestBodies/UpdateCurrentGroup'}
      responses:
        '200': {description: Perfil com grupo atualizado, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentProfile'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /groups:
    get:
      tags: [Groups]
      operationId: listGroups
      summary: Lista ou pesquisa grupos em ordem determinística
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters:
        - {name: search, in: query, schema: {type: string}, description: Vazio lista todos; quando informado exige pelo menos 3 caracteres.}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200':
          description: Página de grupos; o corpo permanece um array para compatibilidade direta.
          headers:
            X-Page: {$ref: '#/components/headers/Page'}
            X-Limit: {$ref: '#/components/headers/Limit'}
            X-Has-Next-Page: {$ref: '#/components/headers/HasNextPage'}
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/GroupSummary'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /groups/me:
    get:
      tags: [Groups]
      operationId: getCurrentGroup
      summary: Retorna somente o grupo e a membership do solicitante
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '200': {description: Grupo atual ou valores nulos, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentGroup'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /groups/me/members:
    get:
      tags: [Groups]
      operationId: listCurrentGroupMembers
      summary: Lista membros somente do grupo atual
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/Page'}]
      responses:
        '200': {description: Página de membros sem email, telefone ou documento, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedGroupMembers'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /groups/invites/consume:
    post:
      tags: [Group invites]
      operationId: consumeGroupInvite
      summary: Consome uma vez um código de convite de alta entropia
      description: Retry pelo mesmo consumidor é idempotente; todos os demais estados indisponíveis retornam o mesmo 404.
      security: [{bearerAuth: []}, {identityCookie: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ConsumeGroupInviteRequest'}}}
      responses:
        '200': {description: Membership atualizada, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentGroup'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/groups/{groupId}/invites:
    parameters: [{$ref: '#/components/parameters/GroupID'}]
    get:
      tags: [Group invites]
      operationId: listGroupInvites
      summary: Lista convites do grupo para administradores
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/Page'}]
      responses:
        '200': {description: Página de convites sem códigos, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedGroupInvites'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Group invites]
      operationId: createGroupInvite
      summary: Cria convite de sete dias para administradores
      description: O código aparece somente nesta resposta e nunca é persistido em claro.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '201': {description: Convite criado com código, content: {application/json: {schema: {$ref: '#/components/schemas/GroupInviteWithCode'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/groups/{groupId}/invites/{inviteId}/renew:
    parameters: [{$ref: '#/components/parameters/GroupID'}, {$ref: '#/components/parameters/InviteID'}]
    post:
      tags: [Group invites]
      operationId: renewGroupInvite
      summary: Revoga o convite anterior e cria outro atomicamente
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '201': {description: Novo convite e código, content: {application/json: {schema: {$ref: '#/components/schemas/GroupInviteWithCode'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/groups/{groupId}/invites/{inviteId}:
    parameters: [{$ref: '#/components/parameters/GroupID'}, {$ref: '#/components/parameters/InviteID'}]
    delete:
      tags: [Group invites]
      operationId: revokeGroupInvite
      summary: Revoga de forma idempotente um convite não consumido
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '204': {description: Convite revogado ou já revogado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /spaces:
    get:
      tags: [Spaces]
      operationId: listSpaces
      summary: Lista os locais físicos da instalação única do DNJ
      description: >-
        Retorna o array consumido pelo mapa do frontend, em ordem name,id. A
        paginação fica nos headers para preservar compatibilidade direta.
      parameters: [{$ref: '#/components/parameters/Page'}]
      responses:
        '200':
          description: Página de espaços; o corpo permanece um array.
          headers:
            X-Page: {$ref: '#/components/headers/Page'}
            X-Limit: {$ref: '#/components/headers/Limit'}
            X-Has-Next-Page: {$ref: '#/components/headers/HasNextPage'}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Space'}}
        '500': {$ref: '#/components/responses/InternalError'}
  /schedule:
    get:
      tags: [Schedule]
      operationId: getSchedule
      summary: Lista a agenda pública com estado temporal derivado no servidor
      description: >-
        Considera somente Activities schedule não arquivadas com janela válida.
        Sem view retorna no máximo 100 itens em ordem startsAt,name,id. view=home
        retorna todas as simultaneamente live e depois até três próximas. O
        instante generatedAt é capturado uma vez por request e serializado em UTC.
      parameters:
        - {name: view, in: query, required: false, schema: {type: string, enum: [home]}}
        - {name: sector, in: query, required: false, schema: {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}, description: Slug persistido do Space; sector é apenas o nome compatível do DTO.}
      responses:
        '200': {description: Agenda pública, content: {application/json: {schema: {$ref: '#/components/schemas/ScheduleResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
  /activities:
    get:
      tags: [Activities]
      operationId: listPublicActivities
      summary: Lista Activities publicamente visíveis
      description: >-
        Inclui schedule futuro em draft e Activities active, paused ou completed;
        exclui archived e drafts não-schedule. Ordenação fixa por startsAt NULLS
        LAST,name,id. Parâmetros não publicados são rejeitados.
      parameters:
        - {name: kind, in: query, required: false, schema: {type: string, enum: [schedule, checkpoint, challenge, competitive, live]}}
        - {name: spaceId, in: query, required: false, schema: {type: string, format: uuid}, description: UUID de um Space persistido.}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: Página pública de Activities, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedPublicActivities'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /activities/{activityId}:
    parameters: [{$ref: '#/components/parameters/ActivityID'}]
    get:
      tags: [Activities]
      operationId: getPublicActivity
      summary: Retorna uma Activity publicamente visível
      description: Activity inexistente, arquivada ou invisível retorna o mesmo NOT_FOUND sem metadados administrativos.
      responses:
        '200': {description: Activity pública, content: {application/json: {schema: {$ref: '#/components/schemas/PublicActivity'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /users/me/favorites:
    get:
      tags: [Favorites]
      operationId: listCurrentUserFavorites
      summary: Lista somente favoritos que continuam publicamente visíveis
      description: Usuário e onboarding são revalidados no banco em cada request; a ordenação é startsAt NULLS LAST,name,id.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/Page'}]
      responses:
        '200': {description: Página de Activities favoritas visíveis, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedPublicActivities'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /users/me/favorites/{activityId}:
    parameters:
      - {$ref: '#/components/parameters/ActivityID'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    put:
      tags: [Favorites]
      operationId: putCurrentUserFavorite
      summary: Favorita idempotentemente uma Activity publicamente visível
      description: >-
        Não cria duplicata nem operation_audit. Retry da mesma chave e intenção
        retorna o 204 original mesmo após mudança posterior da Activity; reutilização
        cruzada retorna IDEMPOTENCY_KEY_REUSED.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '204': {description: Favorito criado, já existente ou retry concluído}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Favorites]
      operationId: deleteCurrentUserFavorite
      summary: Remove um favorito de forma idempotente e sem enumerar Activity
      description: Retorna 204 para favorito existente, ausente e Activity UUID inexistente; não consulta a visibilidade da Activity.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '204': {description: Favorito removido, já ausente ou retry concluído}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/spaces:
    get:
      tags: [Installation administration]
      operationId: listAdminSpaces
      summary: Lista Spaces para configuração administrativa
      description: Exclusivo de ADMIN; ordenado por name,id e paginado em envelope.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/Page'}]
      responses:
        '200': {description: Página de Spaces, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedSpaces'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Installation administration]
      operationId: createAdminSpace
      summary: Cria um Space sem aceitar campos de escopo ou papel
      description: Retry da mesma intenção retorna o 201 e o corpo originais sem novo efeito ou audit.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateAdminSpaceRequest'}}}}
      responses:
        '201': {description: Space criado ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/Space'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/spaces/{spaceId}:
    parameters: [{$ref: '#/components/parameters/SpaceID'}]
    patch:
      tags: [Installation administration]
      operationId: updateAdminSpace
      summary: Altera estritamente slug, name ou mapReference
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateAdminSpaceRequest'}}}}
      responses:
        '200': {description: Space atualizado, no-op auditado ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/Space'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/activities:
    get:
      tags: [Installation administration]
      operationId: listAdminActivities
      summary: Lista a configuração completa de Activities
      description: Exclusivo de ADMIN; ordenado por name,id e paginado em envelope.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/Page'}]
      responses:
        '200': {description: Página de Activities, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedAdminActivities'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Installation administration]
      operationId: createAdminActivity
      summary: Cria uma Activity sempre em draft
      description: status, eventId, papel, assignment e demais campos não publicados são rejeitados.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateAdminActivityRequest'}}}}
      responses:
        '201': {description: Activity draft criada ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/AdminActivity'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/activities/{activityId}:
    parameters: [{$ref: '#/components/parameters/ActivityID'}]
    patch:
      tags: [Installation administration]
      operationId: updateAdminActivity
      summary: Reconfigura uma Activity ou faz a transição validada para archived
      description: >-
        status aceita somente archived. active não pode ser arquivada sem pause;
        start e pause permanecem exclusivamente nas operações gerenciais.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateAdminActivityRequest'}}}}
      responses:
        '200': {description: Activity atualizada, no-op auditado ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/AdminActivity'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/staff:
    get:
      tags: [Installation administration]
      operationId: listAdminStaff
      summary: Lista usuários com papel EVENT_MANAGER
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters:
        - {name: role, in: query, required: true, schema: {type: string, enum: [EVENT_MANAGER]}}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: Página determinística de gestores, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedAdminStaff'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/users/{userId}/role:
    parameters: [{$ref: '#/components/parameters/UserID'}]
    patch:
      tags: [Installation administration]
      operationId: updateAdminUserRole
      summary: Alterna exclusivamente DEFAULT e EVENT_MANAGER
      description: ADMIN nunca pode ser concedido ou removido; gestor com assignments ativos retorna MANAGER_HAS_ASSIGNMENTS.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateAdminUserRoleRequest'}}}}
      responses:
        '200': {description: Papel resultante, no-op auditado ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserRole'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/activities/{activityId}/managers:
    parameters: [{$ref: '#/components/parameters/ActivityID'}]
    get:
      tags: [Installation administration]
      operationId: listAdminActivityManagers
      summary: Lista gestores atribuídos à Activity
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/Page'}]
      responses:
        '200': {description: Página determinística de gestores atribuídos, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedAdminStaff'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/activities/{activityId}/managers/{userId}:
    parameters: [{$ref: '#/components/parameters/ActivityID'}, {$ref: '#/components/parameters/UserID'}]
    put:
      tags: [Installation administration]
      operationId: assignAdminActivityManager
      summary: Atribui gestor elegível de forma idempotente
      description: Usuário, onboarding, papel, Activity e assignment são validados exclusivamente no banco.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: Assignment criado, já existente ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/AdminManagerAssignment'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Installation administration]
      operationId: removeAdminActivityManager
      summary: Remove assignment de forma idempotente
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '204': {description: Assignment removido, já ausente ou retry concluído}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /manager/activities/{activityId}/start:
    parameters:
      - {$ref: '#/components/parameters/ActivityID'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      tags: [Activity operations]
      operationId: startActivity
      summary: Inicia uma atividade em draft ou retoma uma atividade pausada
      description: >-
        ADMIN possui escopo global. EVENT_MANAGER só opera uma atividade com
        assignment persistido; atividade ausente ou fora do assignment usa o
        mesmo 404. Papel e assignment são sempre lidos do banco.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '200': {description: Estado resultante ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityState'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /manager/activities/{activityId}/pause:
    parameters:
      - {$ref: '#/components/parameters/ActivityID'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      tags: [Activity operations]
      operationId: pauseActivity
      summary: Pausa uma atividade ativa
      description: >-
        Possui o mesmo escopo de autorização, isolamento, atomicidade e
        idempotência da operação de início.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '200': {description: Estado resultante ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityState'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /games:
    get:
      tags: [Games]
      operationId: listGames
      summary: Lista Activities competitivas visíveis como jogos
      description: >-
        Game é somente a projeção pública de Activity kind=competitive. Exclui
        draft, archived e Activities não visíveis; ordena por startsAt NULLS
        LAST, name, id e rejeita query desconhecida ou repetida.
      parameters: [{$ref: '#/components/parameters/Page'}]
      responses:
        '200': {description: Catálogo paginado, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedGames'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
  /games/{gameId}:
    parameters: [{$ref: '#/components/parameters/GameID'}]
    get:
      tags: [Games]
      operationId: getGame
      summary: Retorna a projeção pública de um jogo
      description: Inexistente, invisível, draft ou archived retorna o mesmo 404 NOT_FOUND.
      responses:
        '200': {description: Jogo visível, content: {application/json: {schema: {$ref: '#/components/schemas/Game'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /rankings:
    get:
      tags: [Rankings]
      operationId: listRankings
      summary: Lista ranking individual ou de grupos
      description: >-
        Público. scope é obrigatório e aceita somente individual ou groups.
        Posição é ordinal; empates preservam a ordem determinística por pontos
        DESC, nome e id. Query desconhecida ou repetida é inválida.
      parameters:
        - name: scope
          in: query
          required: true
          schema: {type: string, enum: [individual, groups]}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200':
          description: Ranking persistido no escopo solicitado
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/IndividualRankingPage'}
                  - {$ref: '#/components/schemas/GroupRankingPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
  /game/overview:
    get:
      tags: [Rankings]
      operationId: getGameOverview
      summary: Retorna rankings, extrato próprio e posição atual
      description: >-
        Exige usuário DEFAULT existente e onboarding completo. Retorna até 30
        pessoas, 10 grupos e os 50 lançamentos próprios mais recentes. Não
        expõe o reason interno do ledger.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '200': {description: Overview do usuário atual, content: {application/json: {schema: {$ref: '#/components/schemas/GameOverview'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /activity-runs/current:
    get:
      tags: [Game participation]
      operationId: getCurrentActivityRun
      summary: Retorna a run relevante do participante atual
      description: >-
        Sem runId escolhe deterministicamente a participação aberta mais
        recente. Com runId, inclusive terminal, só retorna a run se o usuário
        participa; ausência, UUID inválido, inexistente ou run alheia usa 204.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters:
        - name: runId
          in: query
          required: false
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Run do próprio participante, content: {application/json: {schema: {$ref: '#/components/schemas/ParticipantRunEnvelope'}}}}
        '204': {description: Nenhuma run relevante para este usuário}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /participations/current:
    get:
      tags: [Game participation]
      operationId: getCurrentParticipation
      summary: Retorna a participação aberta do usuário atual
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '200': {description: Participação atual, content: {application/json: {schema: {$ref: '#/components/schemas/ParticipationEnvelope'}}}}
        '204': {description: Nenhuma participação aberta}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /qr/validate:
    post:
      tags: [Game participation]
      operationId: validateGameQR
      summary: Valida QR e registra a entrada idempotente na run
      description: >-
        Aceita estritamente qrToken no corpo e Idempotency-Key no header. Não
        concede pontos nem cria audit privilegiado. QR inválido, revogado ou
        invisível retorna QR_UNAVAILABLE sem enumerar recurso; QR no instante
        exato de expiração retorna QR_EXPIRED.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ValidateGameQRRequest'}}}
      responses:
        '200': {description: Usuário já participava; intenção registrada, content: {application/json: {schema: {$ref: '#/components/schemas/ParticipationEnvelope'}}}}
        '201': {description: Participação criada, content: {application/json: {schema: {$ref: '#/components/schemas/ParticipationEnvelope'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '500': {$ref: '#/components/responses/InternalError'}
  /manager/game-overview:
    get:
      tags: [Game management]
      operationId: getManagerGameOverview
      summary: Retorna catálogo gerenciável e no máximo uma run aberta
      description: >-
        ADMIN possui escopo global. EVENT_MANAGER vê somente Activities com
        assignment persistido. Papel e assignment são confirmados no banco.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '200': {description: Dashboard compatível com o consumidor existente, content: {application/json: {schema: {$ref: '#/components/schemas/ManagerGameOverview'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /manager/runs/{runId}:
    parameters: [{$ref: '#/components/parameters/RunID'}]
    get:
      tags: [Game management]
      operationId: getManagerRun
      summary: Retorna estado e participantes da run no escopo atual
      description: Recurso inexistente e fora do assignment retornam o mesmo 404.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '200': {description: Run gerenciável sem dados de contato, content: {application/json: {schema: {$ref: '#/components/schemas/ManagerRun'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /manager/runs:
    post:
      tags: [Game management]
      operationId: createManagerRun
      summary: Cria uma run draft para uma Activity competitive gerenciável
      description: >-
        Corpo estrito {gameId}. Regras 50/30/20/10 são snapshot do servidor.
        Impede duas runs abertas na mesma Activity. Retry da mesma intenção
        devolve o resultado original e não duplica audit.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateManagerRunRequest'}}}
      responses:
        '201': {description: Run draft criada ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/ManagerRun'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /manager/runs/{runId}/qr:
    parameters:
      - {$ref: '#/components/parameters/RunID'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      tags: [Game management]
      operationId: rotateManagerRunQR
      summary: Cria ou rotaciona o único QR ativo da run draft
      description: >-
        Não aceita corpo. Rotação invalida imediatamente o QR anterior. Token
        expira em 45 minutos ou ao sair de draft; só hash/HMAC é persistido.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '201': {description: Token novo ou token original reconstituído no retry, content: {application/json: {schema: {$ref: '#/components/schemas/ManagerQR'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /manager/runs/{runId}/start:
    parameters: &managerRunMutationParameters
      - {$ref: '#/components/parameters/RunID'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      tags: [Game management]
      operationId: startManagerRun
      summary: Transiciona draft para active e fixa startedAt
      description: Não aceita corpo. startedAt é definido pelo servidor uma única vez.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses: &managerRunMutationResponses
        '200': {description: Estado resultante ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/ManagerRun'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /manager/runs/{runId}/pause:
    parameters: *managerRunMutationParameters
    post:
      tags: [Game management]
      operationId: pauseManagerRun
      summary: Transiciona active para paused
      description: Não aceita corpo; estados incompatíveis retornam 409.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses: *managerRunMutationResponses
  /manager/runs/{runId}/resume:
    parameters: *managerRunMutationParameters
    post:
      tags: [Game management]
      operationId: resumeManagerRun
      summary: Transiciona paused para active sem reescrever startedAt
      description: Não aceita corpo; estados incompatíveis retornam 409.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses: *managerRunMutationResponses
  /manager/runs/{runId}/results:
    parameters: *managerRunMutationParameters
    post:
      tags: [Game management]
      operationId: finalizeManagerRunResults
      summary: Valida resultados completos, premia atomicamente e conclui a run
      description: >-
        Corpo estrito com exatamente todos os participantes. first, second e
        third aceitam no máximo um usuário. Locks são ordenados; ledger,
        users.points, estado completed e audit formam uma única transação.
      security: [{bearerAuth: []}, {identityCookie: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FinalizeManagerRunResultsRequest'}}}
      responses: *managerRunMutationResponses
  /manager/runs/{runId}/cancel:
    parameters: *managerRunMutationParameters
    post:
      tags: [Game management]
      operationId: cancelManagerRun
      summary: Cancela uma run aberta sem conceder pontos
      description: Não aceita corpo; cancelled é terminal e endedAt vem do servidor.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses: *managerRunMutationResponses
  /media/upload-intents:
    post:
      tags: [Media]
      operationId: createMediaUploadIntent
      summary: Cria uma intenção de upload direto ao bucket privado
      description: >-
        Corpo estrito {contentType, bytes, checksumSha256}. Aceita somente
        image/jpeg e image/png, até 10 MiB. checksumSha256 é SHA-256 em
        Base64 canônico. Gera uma staging key privada e aleatória sem PII; a
        intenção e a URL assinada expiram em 10 minutos. A URL assinada nunca
        é persistida; retry com a mesma Idempotency-Key reconstrói a mesma
        resposta a partir de metadados seguros e do instante original.
        Exige DEFAULT com onboarding completo; sem configuração de retenção
        válida retorna 503 sem afetar autenticação ou catálogo.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateUploadIntentRequest'}}}
      responses:
        '201': {description: Intenção criada ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/UploadIntent'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /media/{mediaAssetId}/complete:
    parameters:
      - {$ref: '#/components/parameters/MediaAssetID'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      tags: [Media]
      operationId: completeMediaUpload
      summary: Confirma, sanitiza e publica o objeto enviado
      description: >-
        Não aceita corpo. Valida ownership, estado e expiração; obtém
        metadados reais no provedor; baixa com limite estrito; valida magic
        bytes e configuração real da imagem (até 20 megapixels); decodifica
        e reencoda removendo EXIF/GPS; grava uma versão final privada e
        imutável distinta da staging key; só então marca o asset available e
        enfileira a remoção da staging key. Serializado por claim/lease
        durável que sobrevive a reinício do processo. Asset alheio ou
        inexistente retorna o mesmo 404.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '200': {description: Asset confirmado ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/MediaAsset'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /moments:
    get:
      tags: [Moments]
      operationId: listMoments
      summary: Lista Moments no escopo solicitado com paginação por cursor
      description: >-
        scope é obrigatório e aceita somente feed, mine ou group; ausência ou
        repetição é inválida. cursor é opaco, assinado e sem PII; inválido
        retorna 400. feed e group exibem somente público, aprovado e com
        asset disponível de autores elegíveis; mine preserva todos os Moments
        próprios, inclusive privados ou rejeitados. group usa o grupo atual
        persistido do ator. Ordena por capturedAt DESC, id DESC; 20 por
        página.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters:
        - name: scope
          in: query
          required: true
          schema: {type: string, enum: [feed, mine, group]}
        - name: cursor
          in: query
          required: false
          schema: {type: string}
      responses:
        '200': {description: Página de Moments no escopo solicitado, content: {application/json: {schema: {$ref: '#/components/schemas/MomentPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Moments]
      operationId: createMoment
      summary: Publica um Moment free ou challenge a partir de um asset disponível
      description: >-
        Corpo estrito {mediaAssetId, publishConsent, participationId
        opcional}. Sem participationId cria Moment free sem pontos; com
        participationId deriva origem challenge, exigindo Participation
        própria, elegível e dentro da janela operacional da Activity. Origem,
        pontos, ownership e timestamps são sempre derivados pelo servidor.
        publishConsent=true publica public e concede o snapshot de
        Activity.momentPoints quando challenge; publishConsent=false nunca
        concede pontos. Um asset e uma Participation não podem produzir mais
        de um Moment, mesmo sob concorrência.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateMomentRequest'}}}
      responses:
        '201': {description: Moment criado ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/Moment'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /moments/{momentId}/likes:
    parameters:
      - {$ref: '#/components/parameters/MomentID'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      tags: [Moments]
      operationId: toggleMomentLike
      summary: Alterna o like do ator atual em um Moment público e disponível
      description: >-
        Não aceita corpo. Só é permitido em Moment público, aprovado e com
        asset disponível; inexistente ou invisível retorna o mesmo 404.
        Serializado por (momentId, userId); a mesma Idempotency-Key retorna
        exatamente o estado original. Não gera pontos nem auditoria.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '200': {description: Estado do like após a alternância, content: {application/json: {schema: {$ref: '#/components/schemas/Like'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/moments/moderation:
    get:
      tags: [Moderation]
      operationId: listMomentModeration
      summary: Lista a fila de moderação corretiva de Moments
      description: >-
        Exige ADMIN confirmado no banco; EVENT_MANAGER não recebe permissão
        global. queue é obrigatória e aceita somente general (Moments free
        públicos aprovados disponíveis) ou challenge (idem, de origem
        challenge). Ordena por capturedAt ASC, id ASC; 50 por página. Não
        expõe email, documento, telefone, grupo interno, chave de storage ou
        auditoria.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters:
        - name: queue
          in: query
          required: true
          schema: {type: string, enum: [general, challenge]}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: Página da fila de moderação, content: {application/json: {schema: {$ref: '#/components/schemas/ModerationPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/moments/{momentId}/moderation:
    parameters:
      - {$ref: '#/components/parameters/MomentID'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      tags: [Moderation]
      operationId: moderateMoment
      summary: Aplica uma ação corretiva sobre um Moment
      description: >-
        Corpo estrito {action}, sem campo reason. Aceita somente deny_points
        (só válida quando houve premiação; reverte pontos atomicamente,
        torna o Moment privado e rejeitado, preserva a foto) ou delete_photo
        (torna o Moment privado e rejeitado, marca o asset removido
        logicamente, reverte pontos quando existirem, enfileira limpeza
        física assíncrona). deny_points sem premiação retorna 409. Decisão já
        aplicada com chave nova retorna o estado terminal seguro sem novo
        efeito; gera operation_audit mínimo sem imagem, URL assinada ou PII.
      security: [{bearerAuth: []}, {identityCookie: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ModerationRequest'}}}
      responses:
        '200': {description: Estado resultante da moderação, content: {application/json: {schema: {$ref: '#/components/schemas/Moderation'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /notifications/preferences:
    get:
      tags: [Notifications]
      operationId: getNotificationPreferences
      summary: Retorna as preferências de notificação do ator atual
      description: >-
        momentModerationEnabled é sempre true na resposta; não existe caminho
        de escrita para desabilitar notificações de moderação/segurança da
        própria conta. Um ator que nunca personalizou preferências recebe o
        padrão: todas habilitadas. Exige DEFAULT com onboarding completo.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '200': {description: Preferências atuais do ator, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreferences'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      tags: [Notifications]
      operationId: updateNotificationPreferences
      summary: Atualiza as preferências de notificação do ator atual
      description: >-
        Corpo estrito {pointsEnabled opcional, announcementEnabled
        opcional}; qualquer outro campo, incluindo momentModerationEnabled, é
        rejeitado por decodificação estrita. Campos omitidos preservam o
        valor atual (ou o padrão, se ainda não existir preferência
        persistida). Exige DEFAULT com onboarding completo.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateNotificationPreferencesRequest'}}}
      responses:
        '200': {description: Preferências atualizadas ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreferences'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Lista as notificações do ator atual com contagem de não lidas
      description: >-
        Ordena por createdAt DESC, id DESC; 10 por página (?page=N,
        1-indexado). unreadCount é a contagem agregada de não lidas do ator,
        usada pelo badge do app. Nunca expõe notificação de outro usuário.
        Exige DEFAULT com onboarding completo.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: Página de notificações do ator, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /notifications/{notificationId}/read:
    parameters:
      - {$ref: '#/components/parameters/NotificationID'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Marca uma notificação do ator atual como lida
      description: >-
        Não aceita corpo. Idempotente: reenviar a mesma chave, ou marcar uma
        notificação já lida, retorna o mesmo estado terminal — nunca reverte
        read para unread. Notificação alheia ou inexistente retorna o mesmo
        404, sem permitir enumeração. Exige DEFAULT com onboarding completo.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '200': {description: Notificação marcada como lida ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/Notification'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/notifications:
    post:
      tags: [Notification administration]
      operationId: sendAdminNotification
      summary: Envia uma notificação administrativa de conteúdo livre
      description: >-
        Corpo estrito {title, body, targetUserIds opcional}. Única via de
        conteúdo livre desta iteração; sempre atribuída ao ator ADMIN
        autenticado, nunca a um usuário arbitrário. Exige ADMIN confirmado no
        banco; EVENT_MANAGER não recebe essa permissão. Sem targetUserIds,
        faz broadcast para todo usuário DEFAULT, existente, com onboarding
        completo e que não desabilitou announcementEnabled; com
        targetUserIds, restringe o broadcast a esse conjunto, ainda filtrado
        pelos mesmos critérios de elegibilidade e preferência. A resposta
        expõe somente a contagem agregada de destinatários — nunca a lista.
        Retry com a mesma Idempotency-Key replica o recipientCount original
        sem duplicar entrega.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminSendNotificationRequest'}}}
      responses:
        '201': {description: Notificação(ões) enviada(s) ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/AdminSendNotificationResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    identityCookie: {type: apiKey, in: cookie, name: identity_token}
    refreshCookie: {type: apiKey, in: cookie, name: refresh_token}
    csrfCookie: {type: apiKey, in: cookie, name: csrf_token}
  headers:
    RequestID:
      description: Identificador seguro de correlação da requisição
      schema: {type: string}
    SessionCookies:
      description: >-
        identity_token e refresh_token são HttpOnly; csrf_token é legível pelo
        cliente. Em ambiente publicado todos são Secure e SameSite=None.
      schema: {type: string}
    Page: {description: Página atual, schema: {type: string}}
    Limit: {description: Quantidade máxima por página, schema: {type: integer}}
    HasNextPage: {description: Indica existência da próxima página, schema: {type: boolean}}
  parameters:
    CSRFHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 32}
    Page:
      name: page
      in: query
      required: false
      description: Página 1-indexada; 0 é aceito como alias da primeira página.
      schema: {type: integer, minimum: 0, default: 1}
    GroupID:
      name: groupId
      in: path
      required: true
      schema: {type: string, pattern: '^[1-9][0-9]*$'}
    InviteID:
      name: inviteId
      in: path
      required: true
      schema: {type: string, pattern: '^[1-9][0-9]*$'}
    ActivityID:
      name: activityId
      in: path
      required: true
      schema: {type: string, format: uuid}
    GameID:
      name: gameId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RunID:
      name: runId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SpaceID:
      name: spaceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserID:
      name: userId
      in: path
      required: true
      schema: {type: string, pattern: '^[1-9][0-9]*$'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID estável reutilizado somente no retry da mesma intenção pelo mesmo ator.
      schema: {type: string, format: uuid}
    MediaAssetID:
      name: mediaAssetId
      in: path
      required: true
      schema: {type: string, format: uuid}
    MomentID:
      name: momentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    NotificationID:
      name: notificationId
      in: path
      required: true
      schema: {type: string, format: uuid}
  requestBodies:
    UpdateCurrentGroup:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/UpdateCurrentGroupRequest'}
  responses:
    IdentitySession:
      description: Sessão criada ou renovada
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
        Set-Cookie: {$ref: '#/components/headers/SessionCookies'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/IdentitySessionResponse'}
    BadRequest:
      description: Requisição inválida
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Credencial ausente, inválida, expirada ou reutilizada
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Proteção CSRF ou autorização rejeitou a requisição
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Recurso relacionado não encontrado
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Estado atual impede a operação
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyRequests:
      description: Limite de reenvio excedido — aguarde o cooldown antes de tentar de novo
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Gone:
      description: Recurso temporal expirado
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Erro interno sem detalhes sensíveis
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    DependencyUnavailable:
      description: Dependência obrigatória indisponível
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooLarge:
      description: Corpo ou imagem excede o limite permitido
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: Tipo de conteúdo não suportado
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnprocessableEntity:
      description: Conteúdo malformado, disfarçado ou fora dos limites de sanitização
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    HealthcheckResponse:
      type: object
      required: [status, service]
      properties:
        status: {type: string, enum: [ok]}
        service: {type: string, enum: [dnj-game-api]}
    ReadinessResponse:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ready]}
    GoogleAuthRequest:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken: {type: string, minLength: 1}
    EmailSignupRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email}
    EmailSignupResponse:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [CODE_SENT]}
    VerifyEmailSignupRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email: {type: string, format: email}
        code: {type: string, minLength: 6, maxLength: 6, example: '042917'}
    CompleteOnboardingRequest:
      type: object
      additionalProperties: false
      required: [document, mobilePhone, groupId]
      properties:
        document: {type: string, example: '52998224725'}
        mobilePhone: {type: string, example: '5541999990000'}
        groupId: {type: string, pattern: '^[1-9][0-9]*$', example: '12'}
    IdentitySessionResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, csrfToken, onboardingRequired, user]
      properties:
        accessToken: {type: string, description: JWT HS256 válido por 900 segundos}
        tokenType: {type: string, enum: [Bearer]}
        expiresIn: {type: integer, format: int64, enum: [900]}
        csrfToken: {type: string, description: Mesmo valor do cookie csrf_token}
        onboardingRequired: {type: boolean}
        user: {$ref: '#/components/schemas/IdentityUser'}
    CurrentSessionResponse:
      type: object
      required: [onboardingRequired, user]
      properties:
        onboardingRequired: {type: boolean}
        user: {$ref: '#/components/schemas/IdentityUser'}
    IdentityUser:
      type: object
      required: [id, email, name, mobilePhone, documentMasked, role, group, onboardingComplete]
      properties:
        id: {type: string}
        email: {type: string, format: email}
        name: {type: string}
        mobilePhone: {type: string}
        documentMasked: {type: string, description: CPF integral nunca é retornado pela V2}
        role: {type: string, enum: [ADMIN, EVENT_MANAGER, DEFAULT]}
        group:
          nullable: true
          allOf:
            - {$ref: '#/components/schemas/GroupSummary'}
        onboardingComplete: {type: boolean}
    GroupSummary:
      type: object
      required: [id, groupName]
      properties:
        id: {type: string}
        groupName: {type: string}
    CurrentProfile:
      type: object
      required: [id, email, name, mobilePhone, documentMasked, role, group, points, rankPosition, onboardingComplete, createdAt, updatedAt]
      properties:
        id: {type: string, pattern: '^[1-9][0-9]*$'}
        email: {type: string, format: email, readOnly: true}
        name: {type: string, minLength: 2, maxLength: 120}
        mobilePhone: {type: string}
        documentMasked: {type: string, readOnly: true, description: CPF integral e hashes nunca são retornados.}
        role: {type: string, enum: [ADMIN, EVENT_MANAGER, DEFAULT], readOnly: true}
        group:
          nullable: true
          allOf: [{$ref: '#/components/schemas/GroupSummary'}]
        points: {type: integer, minimum: 0, readOnly: true}
        rankPosition: {type: integer, format: int64, minimum: 1, readOnly: true}
        onboardingComplete: {type: boolean, readOnly: true}
        createdAt: {type: string, format: date-time, readOnly: true}
        updatedAt: {type: string, format: date-time, readOnly: true}
    UpdateCurrentProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 2, maxLength: 120}
        mobilePhone: {type: string, minLength: 11, maxLength: 13}
    UpdateCurrentGroupRequest:
      type: object
      additionalProperties: false
      required: [groupId]
      properties:
        groupId: {type: string, pattern: '^[1-9][0-9]*$', nullable: true}
    GroupMembership:
      type: object
      required: [id, userId, groupId, joinedAt]
      properties:
        id: {type: string}
        userId: {type: string}
        groupId: {type: string}
        joinedAt: {type: string, format: date-time}
    CurrentGroup:
      type: object
      required: [group, membership]
      properties:
        group: {nullable: true, allOf: [{$ref: '#/components/schemas/GroupSummary'}]}
        membership: {nullable: true, allOf: [{$ref: '#/components/schemas/GroupMembership'}]}
    GroupMember:
      type: object
      required: [id, name, role, joinedAt]
      properties:
        id: {type: string}
        name: {type: string}
        role: {type: string, enum: [ADMIN, EVENT_MANAGER, DEFAULT]}
        joinedAt: {type: string, format: date-time}
    Pagination:
      type: object
      required: [currentPage, hasNextPage, limit]
      properties:
        currentPage: {type: string}
        hasNextPage: {type: boolean}
        limit: {type: integer, minimum: 1}
    PaginatedGroupMembers:
      type: object
      required: [data, pagination]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/GroupMember'}}
        pagination: {$ref: '#/components/schemas/Pagination'}
    ConsumeGroupInviteRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: {type: string, minLength: 20, description: Código opaco recebido fora da API de listagem.}
    GroupInvite:
      type: object
      required: [id, groupId, status, expiresAt, revokedAt, consumedAt, consumedByUserId, createdByUserId, replacesInviteId, createdAt]
      properties:
        id: {type: string}
        groupId: {type: string}
        status: {type: string, enum: [ACTIVE, EXPIRED, REVOKED, CONSUMED]}
        expiresAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time, nullable: true}
        consumedAt: {type: string, format: date-time, nullable: true}
        consumedByUserId: {type: string, nullable: true}
        createdByUserId: {type: string}
        replacesInviteId: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
    GroupInviteWithCode:
      allOf:
        - {$ref: '#/components/schemas/GroupInvite'}
        - type: object
          required: [code]
          properties: {code: {type: string, minLength: 20, description: Exibido somente na criação ou renovação.}}
    PaginatedGroupInvites:
      type: object
      required: [data, pagination]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/GroupInvite'}}
        pagination: {$ref: '#/components/schemas/Pagination'}
    Space:
      type: object
      required: [id, name, slug, mapReference]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        mapReference: {type: string, nullable: true}
    PublicSpace:
      type: object
      additionalProperties: false
      required: [id, name, slug]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
