openapi: 3.0.3
info:
  title: DNJ Game API V2
  version: 2.4.0
  description: Contrato canônico da V2; somente operações implementadas e testadas são publicadas.
servers:
  - url: http://localhost:8081/v2
    description: Desenvolvimento local
tags:
  - name: Operations
  - name: Identity
  - name: Profile
  - name: Groups
  - name: Group invites
  - name: Spaces
  - name: Schedule
  - name: Activities
  - name: Favorites
  - name: Activity operations
  - name: Installation administration
paths:
  /healthcheck:
    get:
      tags: [Operations]
      operationId: getHealthcheck
      summary: Confirma que o processo HTTP está ativo
      responses:
        '200':
          description: Processo ativo
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthcheckResponse'}
  /readiness:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Confirma que a API e o banco estão prontos
      responses:
        '200':
          description: Dependências prontas
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadinessResponse'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /auth/google:
    post:
      tags: [Identity]
      operationId: authenticateWithGoogle
      summary: Valida um ID token Google e inicia uma sessão
      description: >-
        Valida assinatura, issuer, audience, expiração e email_verified. Uma
        conta nova permanece incompleta até receber CPF, telefone e grupo.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoogleAuthRequest'}
      responses:
        '200': {$ref: '#/components/responses/IdentitySession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/refresh:
    post:
      tags: [Identity]
      operationId: refreshIdentitySession
      summary: Rotaciona o refresh token e renova a sessão
      description: >-
        Requer os cookies refresh_token e csrf_token e o mesmo valor CSRF no
        header. Reuso de refresh token revoga toda a família.
      parameters:
        - {$ref: '#/components/parameters/CSRFHeader'}
      security:
        - refreshCookie: []
          csrfCookie: []
      responses:
        '200': {$ref: '#/components/responses/IdentitySession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/logout:
    post:
      tags: [Identity]
      operationId: logoutIdentitySession
      summary: Revoga a família da sessão atual e remove os cookies
      parameters:
        - {$ref: '#/components/parameters/CSRFHeader'}
      security:
        - refreshCookie: []
          csrfCookie: []
      responses:
        '200':
          description: Sessão revogada
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Set-Cookie: {$ref: '#/components/headers/SessionCookies'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogoutResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/session:
    get:
      tags: [Identity]
      operationId: getCurrentIdentitySession
      summary: Retorna o usuário e o estado atual do onboarding
      security:
        - bearerAuth: []
        - identityCookie: []
      responses:
        '200':
          description: Sessão atual
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentSessionResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/onboarding:
    patch:
      tags: [Identity]
      operationId: completeIdentityOnboarding
      summary: Completa CPF, telefone e grupo do perfil autenticado
      security:
        - bearerAuth: []
        - identityCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompleteOnboardingRequest'}
      responses:
        '200':
          description: Perfil completo
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentSessionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /users/me:
    get:
      tags: [Profile]
      operationId: getCurrentProfile
      summary: Retorna o perfil autenticado sem CPF integral ou hashes
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '200':
          description: Perfil atual
          content: {application/json: {schema: {$ref: '#/components/schemas/CurrentProfile'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      tags: [Profile]
      operationId: updateCurrentProfile
      summary: Edita somente nome e telefone móvel do perfil atual
      description: Email, CPF, identidade, papel, pontos e grupo são somente leitura nesta operação.
      security: [{bearerAuth: []}, {identityCookie: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateCurrentProfileRequest'}}}
      responses:
        '200': {description: Perfil atualizado, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentProfile'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /users/me/group:
    patch:
      tags: [Groups]
      operationId: updateCurrentUserGroup
      summary: Entra, troca ou sai do grupo atual
      security: [{bearerAuth: []}, {identityCookie: []}]
      requestBody: {$ref: '#/components/requestBodies/UpdateCurrentGroup'}
      responses:
        '200': {description: Perfil com grupo atualizado, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentProfile'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Groups]
      operationId: updateCurrentUserGroupCompatibility
      deprecated: true
      summary: Alias temporário compatível com o frontend atual
      security: [{bearerAuth: []}, {identityCookie: []}]
      requestBody: {$ref: '#/components/requestBodies/UpdateCurrentGroup'}
      responses:
        '200': {description: Perfil com grupo atualizado, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentProfile'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /groups:
    get:
      tags: [Groups]
      operationId: listGroups
      summary: Lista ou pesquisa grupos em ordem determinística
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters:
        - {name: search, in: query, schema: {type: string}, description: Vazio lista todos; quando informado exige pelo menos 3 caracteres.}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200':
          description: Página de grupos; o corpo permanece um array para compatibilidade direta.
          headers:
            X-Page: {$ref: '#/components/headers/Page'}
            X-Limit: {$ref: '#/components/headers/Limit'}
            X-Has-Next-Page: {$ref: '#/components/headers/HasNextPage'}
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/GroupSummary'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /groups/me:
    get:
      tags: [Groups]
      operationId: getCurrentGroup
      summary: Retorna somente o grupo e a membership do solicitante
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '200': {description: Grupo atual ou valores nulos, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentGroup'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /groups/me/members:
    get:
      tags: [Groups]
      operationId: listCurrentGroupMembers
      summary: Lista membros somente do grupo atual
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/Page'}]
      responses:
        '200': {description: Página de membros sem email, telefone ou documento, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedGroupMembers'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /groups/invites/consume:
    post:
      tags: [Group invites]
      operationId: consumeGroupInvite
      summary: Consome uma vez um código de convite de alta entropia
      description: Retry pelo mesmo consumidor é idempotente; todos os demais estados indisponíveis retornam o mesmo 404.
      security: [{bearerAuth: []}, {identityCookie: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ConsumeGroupInviteRequest'}}}
      responses:
        '200': {description: Membership atualizada, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentGroup'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/groups/{groupId}/invites:
    parameters: [{$ref: '#/components/parameters/GroupID'}]
    get:
      tags: [Group invites]
      operationId: listGroupInvites
      summary: Lista convites do grupo para administradores
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/Page'}]
      responses:
        '200': {description: Página de convites sem códigos, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedGroupInvites'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Group invites]
      operationId: createGroupInvite
      summary: Cria convite de sete dias para administradores
      description: O código aparece somente nesta resposta e nunca é persistido em claro.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '201': {description: Convite criado com código, content: {application/json: {schema: {$ref: '#/components/schemas/GroupInviteWithCode'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/groups/{groupId}/invites/{inviteId}/renew:
    parameters: [{$ref: '#/components/parameters/GroupID'}, {$ref: '#/components/parameters/InviteID'}]
    post:
      tags: [Group invites]
      operationId: renewGroupInvite
      summary: Revoga o convite anterior e cria outro atomicamente
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '201': {description: Novo convite e código, content: {application/json: {schema: {$ref: '#/components/schemas/GroupInviteWithCode'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/groups/{groupId}/invites/{inviteId}:
    parameters: [{$ref: '#/components/parameters/GroupID'}, {$ref: '#/components/parameters/InviteID'}]
    delete:
      tags: [Group invites]
      operationId: revokeGroupInvite
      summary: Revoga de forma idempotente um convite não consumido
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '204': {description: Convite revogado ou já revogado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /spaces:
    get:
      tags: [Spaces]
      operationId: listSpaces
      summary: Lista os locais físicos da instalação única do DNJ
      description: >-
        Retorna o array consumido pelo mapa do frontend, em ordem name,id. A
        paginação fica nos headers para preservar compatibilidade direta.
      parameters: [{$ref: '#/components/parameters/Page'}]
      responses:
        '200':
          description: Página de espaços; o corpo permanece um array.
          headers:
            X-Page: {$ref: '#/components/headers/Page'}
            X-Limit: {$ref: '#/components/headers/Limit'}
            X-Has-Next-Page: {$ref: '#/components/headers/HasNextPage'}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Space'}}
        '500': {$ref: '#/components/responses/InternalError'}
  /schedule:
    get:
      tags: [Schedule]
      operationId: getSchedule
      summary: Lista a agenda pública com estado temporal derivado no servidor
      description: >-
        Considera somente Activities schedule não arquivadas com janela válida.
        Sem view retorna no máximo 100 itens em ordem startsAt,name,id. view=home
        retorna todas as simultaneamente live e depois até três próximas. O
        instante generatedAt é capturado uma vez por request e serializado em UTC.
      parameters:
        - {name: view, in: query, required: false, schema: {type: string, enum: [home]}}
        - {name: sector, in: query, required: false, schema: {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}, description: Slug persistido do Space; sector é apenas o nome compatível do DTO.}
      responses:
        '200': {description: Agenda pública, content: {application/json: {schema: {$ref: '#/components/schemas/ScheduleResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
  /activities:
    get:
      tags: [Activities]
      operationId: listPublicActivities
      summary: Lista Activities publicamente visíveis
      description: >-
        Inclui schedule futuro em draft e Activities active, paused ou completed;
        exclui archived e drafts não-schedule. Ordenação fixa por startsAt NULLS
        LAST,name,id. Parâmetros não publicados são rejeitados.
      parameters:
        - {name: kind, in: query, required: false, schema: {type: string, enum: [schedule, checkpoint, challenge, competitive, live]}}
        - {name: spaceId, in: query, required: false, schema: {type: string, format: uuid}, description: UUID de um Space persistido.}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: Página pública de Activities, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedPublicActivities'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /activities/{activityId}:
    parameters: [{$ref: '#/components/parameters/ActivityID'}]
    get:
      tags: [Activities]
      operationId: getPublicActivity
      summary: Retorna uma Activity publicamente visível
      description: Activity inexistente, arquivada ou invisível retorna o mesmo NOT_FOUND sem metadados administrativos.
      responses:
        '200': {description: Activity pública, content: {application/json: {schema: {$ref: '#/components/schemas/PublicActivity'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /users/me/favorites:
    get:
      tags: [Favorites]
      operationId: listCurrentUserFavorites
      summary: Lista somente favoritos que continuam publicamente visíveis
      description: Usuário e onboarding são revalidados no banco em cada request; a ordenação é startsAt NULLS LAST,name,id.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/Page'}]
      responses:
        '200': {description: Página de Activities favoritas visíveis, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedPublicActivities'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /users/me/favorites/{activityId}:
    parameters:
      - {$ref: '#/components/parameters/ActivityID'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    put:
      tags: [Favorites]
      operationId: putCurrentUserFavorite
      summary: Favorita idempotentemente uma Activity publicamente visível
      description: >-
        Não cria duplicata nem operation_audit. Retry da mesma chave e intenção
        retorna o 204 original mesmo após mudança posterior da Activity; reutilização
        cruzada retorna IDEMPOTENCY_KEY_REUSED.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '204': {description: Favorito criado, já existente ou retry concluído}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Favorites]
      operationId: deleteCurrentUserFavorite
      summary: Remove um favorito de forma idempotente e sem enumerar Activity
      description: Retorna 204 para favorito existente, ausente e Activity UUID inexistente; não consulta a visibilidade da Activity.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '204': {description: Favorito removido, já ausente ou retry concluído}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/spaces:
    get:
      tags: [Installation administration]
      operationId: listAdminSpaces
      summary: Lista Spaces para configuração administrativa
      description: Exclusivo de ADMIN; ordenado por name,id e paginado em envelope.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/Page'}]
      responses:
        '200': {description: Página de Spaces, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedSpaces'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Installation administration]
      operationId: createAdminSpace
      summary: Cria um Space sem aceitar campos de escopo ou papel
      description: Retry da mesma intenção retorna o 201 e o corpo originais sem novo efeito ou audit.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateAdminSpaceRequest'}}}}
      responses:
        '201': {description: Space criado ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/Space'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/spaces/{spaceId}:
    parameters: [{$ref: '#/components/parameters/SpaceID'}]
    patch:
      tags: [Installation administration]
      operationId: updateAdminSpace
      summary: Altera estritamente slug, name ou mapReference
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateAdminSpaceRequest'}}}}
      responses:
        '200': {description: Space atualizado, no-op auditado ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/Space'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/activities:
    get:
      tags: [Installation administration]
      operationId: listAdminActivities
      summary: Lista a configuração completa de Activities
      description: Exclusivo de ADMIN; ordenado por name,id e paginado em envelope.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/Page'}]
      responses:
        '200': {description: Página de Activities, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedAdminActivities'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Installation administration]
      operationId: createAdminActivity
      summary: Cria uma Activity sempre em draft
      description: status, eventId, papel, assignment e demais campos não publicados são rejeitados.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateAdminActivityRequest'}}}}
      responses:
        '201': {description: Activity draft criada ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/AdminActivity'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/activities/{activityId}:
    parameters: [{$ref: '#/components/parameters/ActivityID'}]
    patch:
      tags: [Installation administration]
      operationId: updateAdminActivity
      summary: Reconfigura uma Activity ou faz a transição validada para archived
      description: >-
        status aceita somente archived. active não pode ser arquivada sem pause;
        start e pause permanecem exclusivamente nas operações gerenciais.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateAdminActivityRequest'}}}}
      responses:
        '200': {description: Activity atualizada, no-op auditado ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/AdminActivity'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/staff:
    get:
      tags: [Installation administration]
      operationId: listAdminStaff
      summary: Lista usuários com papel EVENT_MANAGER
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters:
        - {name: role, in: query, required: true, schema: {type: string, enum: [EVENT_MANAGER]}}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: Página determinística de gestores, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedAdminStaff'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/users/{userId}/role:
    parameters: [{$ref: '#/components/parameters/UserID'}]
    patch:
      tags: [Installation administration]
      operationId: updateAdminUserRole
      summary: Alterna exclusivamente DEFAULT e EVENT_MANAGER
      description: ADMIN nunca pode ser concedido ou removido; gestor com assignments ativos retorna MANAGER_HAS_ASSIGNMENTS.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateAdminUserRoleRequest'}}}}
      responses:
        '200': {description: Papel resultante, no-op auditado ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserRole'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/activities/{activityId}/managers:
    parameters: [{$ref: '#/components/parameters/ActivityID'}]
    get:
      tags: [Installation administration]
      operationId: listAdminActivityManagers
      summary: Lista gestores atribuídos à Activity
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/Page'}]
      responses:
        '200': {description: Página determinística de gestores atribuídos, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedAdminStaff'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/activities/{activityId}/managers/{userId}:
    parameters: [{$ref: '#/components/parameters/ActivityID'}, {$ref: '#/components/parameters/UserID'}]
    put:
      tags: [Installation administration]
      operationId: assignAdminActivityManager
      summary: Atribui gestor elegível de forma idempotente
      description: Usuário, onboarding, papel, Activity e assignment são validados exclusivamente no banco.
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: Assignment criado, já existente ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/AdminManagerAssignment'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Installation administration]
      operationId: removeAdminActivityManager
      summary: Remove assignment de forma idempotente
      security: [{bearerAuth: []}, {identityCookie: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '204': {description: Assignment removido, já ausente ou retry concluído}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /manager/activities/{activityId}/start:
    parameters:
      - {$ref: '#/components/parameters/ActivityID'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      tags: [Activity operations]
      operationId: startActivity
      summary: Inicia uma atividade em draft ou retoma uma atividade pausada
      description: >-
        ADMIN possui escopo global. EVENT_MANAGER só opera uma atividade com
        assignment persistido; atividade ausente ou fora do assignment usa o
        mesmo 404. Papel e assignment são sempre lidos do banco.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '200': {description: Estado resultante ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityState'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /manager/activities/{activityId}/pause:
    parameters:
      - {$ref: '#/components/parameters/ActivityID'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      tags: [Activity operations]
      operationId: pauseActivity
      summary: Pausa uma atividade ativa
      description: >-
        Possui o mesmo escopo de autorização, isolamento, atomicidade e
        idempotência da operação de início.
      security: [{bearerAuth: []}, {identityCookie: []}]
      responses:
        '200': {description: Estado resultante ou resultado original do retry, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityState'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    identityCookie: {type: apiKey, in: cookie, name: identity_token}
    refreshCookie: {type: apiKey, in: cookie, name: refresh_token}
    csrfCookie: {type: apiKey, in: cookie, name: csrf_token}
  headers:
    RequestID:
      description: Identificador seguro de correlação da requisição
      schema: {type: string}
    SessionCookies:
      description: >-
        identity_token e refresh_token são HttpOnly; csrf_token é legível pelo
        cliente. Em ambiente publicado todos são Secure e SameSite=None.
      schema: {type: string}
    Page: {description: Página atual, schema: {type: string}}
    Limit: {description: Quantidade máxima por página, schema: {type: integer}}
    HasNextPage: {description: Indica existência da próxima página, schema: {type: boolean}}
  parameters:
    CSRFHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 32}
    Page:
      name: page
      in: query
      required: false
      description: Página 1-indexada; 0 é aceito como alias da primeira página.
      schema: {type: integer, minimum: 0, default: 1}
    GroupID:
      name: groupId
      in: path
      required: true
      schema: {type: string, pattern: '^[1-9][0-9]*$'}
    InviteID:
      name: inviteId
      in: path
      required: true
      schema: {type: string, pattern: '^[1-9][0-9]*$'}
    ActivityID:
      name: activityId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SpaceID:
      name: spaceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserID:
      name: userId
      in: path
      required: true
      schema: {type: string, pattern: '^[1-9][0-9]*$'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID estável reutilizado somente no retry da mesma intenção pelo mesmo ator.
      schema: {type: string, format: uuid}
  requestBodies:
    UpdateCurrentGroup:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/UpdateCurrentGroupRequest'}
  responses:
    IdentitySession:
      description: Sessão criada ou renovada
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
        Set-Cookie: {$ref: '#/components/headers/SessionCookies'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/IdentitySessionResponse'}
    BadRequest:
      description: Requisição inválida
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Credencial ausente, inválida, expirada ou reutilizada
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Proteção CSRF ou autorização rejeitou a requisição
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Recurso relacionado não encontrado
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Estado atual impede a operação
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Erro interno sem detalhes sensíveis
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    DependencyUnavailable:
      description: Dependência obrigatória indisponível
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    HealthcheckResponse:
      type: object
      required: [status, service]
      properties:
        status: {type: string, enum: [ok]}
        service: {type: string, enum: [dnj-game-api]}
    ReadinessResponse:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ready]}
    GoogleAuthRequest:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken: {type: string, minLength: 1}
    CompleteOnboardingRequest:
      type: object
      additionalProperties: false
      required: [document, mobilePhone, groupId]
      properties:
        document: {type: string, example: '52998224725'}
        mobilePhone: {type: string, example: '5541999990000'}
        groupId: {type: string, pattern: '^[1-9][0-9]*$', example: '12'}
    IdentitySessionResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, csrfToken, onboardingRequired, user]
      properties:
        accessToken: {type: string, description: JWT HS256 válido por 900 segundos}
        tokenType: {type: string, enum: [Bearer]}
        expiresIn: {type: integer, format: int64, enum: [900]}
        csrfToken: {type: string, description: Mesmo valor do cookie csrf_token}
        onboardingRequired: {type: boolean}
        user: {$ref: '#/components/schemas/IdentityUser'}
    CurrentSessionResponse:
      type: object
      required: [onboardingRequired, user]
      properties:
        onboardingRequired: {type: boolean}
        user: {$ref: '#/components/schemas/IdentityUser'}
    IdentityUser:
      type: object
      required: [id, email, name, mobilePhone, documentMasked, role, group, onboardingComplete]
      properties:
        id: {type: string}
        email: {type: string, format: email}
        name: {type: string}
        mobilePhone: {type: string}
        documentMasked: {type: string, description: CPF integral nunca é retornado pela V2}
        role: {type: string, enum: [ADMIN, EVENT_MANAGER, DEFAULT]}
        group:
          nullable: true
          allOf:
            - {$ref: '#/components/schemas/GroupSummary'}
        onboardingComplete: {type: boolean}
    GroupSummary:
      type: object
      required: [id, groupName]
      properties:
        id: {type: string}
        groupName: {type: string}
    CurrentProfile:
      type: object
      required: [id, email, name, mobilePhone, documentMasked, role, group, points, rankPosition, onboardingComplete, createdAt, updatedAt]
      properties:
        id: {type: string, pattern: '^[1-9][0-9]*$'}
        email: {type: string, format: email, readOnly: true}
        name: {type: string, minLength: 2, maxLength: 120}
        mobilePhone: {type: string}
        documentMasked: {type: string, readOnly: true, description: CPF integral e hashes nunca são retornados.}
        role: {type: string, enum: [ADMIN, EVENT_MANAGER, DEFAULT], readOnly: true}
        group:
          nullable: true
          allOf: [{$ref: '#/components/schemas/GroupSummary'}]
        points: {type: integer, minimum: 0, readOnly: true}
        rankPosition: {type: integer, format: int64, minimum: 1, readOnly: true}
        onboardingComplete: {type: boolean, readOnly: true}
        createdAt: {type: string, format: date-time, readOnly: true}
        updatedAt: {type: string, format: date-time, readOnly: true}
    UpdateCurrentProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 2, maxLength: 120}
        mobilePhone: {type: string, minLength: 11, maxLength: 13}
    UpdateCurrentGroupRequest:
      type: object
      additionalProperties: false
      required: [groupId]
      properties:
        groupId: {type: string, pattern: '^[1-9][0-9]*$', nullable: true}
    GroupMembership:
      type: object
      required: [id, userId, groupId, joinedAt]
      properties:
        id: {type: string}
        userId: {type: string}
        groupId: {type: string}
        joinedAt: {type: string, format: date-time}
    CurrentGroup:
      type: object
      required: [group, membership]
      properties:
        group: {nullable: true, allOf: [{$ref: '#/components/schemas/GroupSummary'}]}
        membership: {nullable: true, allOf: [{$ref: '#/components/schemas/GroupMembership'}]}
    GroupMember:
      type: object
      required: [id, name, role, joinedAt]
      properties:
        id: {type: string}
        name: {type: string}
        role: {type: string, enum: [ADMIN, EVENT_MANAGER, DEFAULT]}
        joinedAt: {type: string, format: date-time}
    Pagination:
      type: object
      required: [currentPage, hasNextPage, limit]
      properties:
        currentPage: {type: string}
        hasNextPage: {type: boolean}
        limit: {type: integer, minimum: 1}
    PaginatedGroupMembers:
      type: object
      required: [data, pagination]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/GroupMember'}}
        pagination: {$ref: '#/components/schemas/Pagination'}
    ConsumeGroupInviteRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: {type: string, minLength: 20, description: Código opaco recebido fora da API de listagem.}
    GroupInvite:
      type: object
      required: [id, groupId, status, expiresAt, revokedAt, consumedAt, consumedByUserId, createdByUserId, replacesInviteId, createdAt]
      properties:
        id: {type: string}
        groupId: {type: string}
        status: {type: string, enum: [ACTIVE, EXPIRED, REVOKED, CONSUMED]}
        expiresAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time, nullable: true}
        consumedAt: {type: string, format: date-time, nullable: true}
        consumedByUserId: {type: string, nullable: true}
        createdByUserId: {type: string}
        replacesInviteId: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
    GroupInviteWithCode:
      allOf:
        - {$ref: '#/components/schemas/GroupInvite'}
        - type: object
          required: [code]
          properties: {code: {type: string, minLength: 20, description: Exibido somente na criação ou renovação.}}
    PaginatedGroupInvites:
      type: object
      required: [data, pagination]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/GroupInvite'}}
        pagination: {$ref: '#/components/schemas/Pagination'}
    Space:
      type: object
      required: [id, name, slug, mapReference]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        mapReference: {type: string, nullable: true}
    PublicSpace:
      type: object
      additionalProperties: false
      required: [id, name, slug]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
    ScheduleItem:
      type: object
      additionalProperties: false
      required: [id, title, description, startsAt, endsAt, sector, state]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string, nullable: true}
        startsAt: {type: string, format: date-time, description: Instante UTC RFC 3339 com Z., example: '2026-10-18T15:00:00Z'}
        endsAt: {type: string, format: date-time, description: Instante UTC RFC 3339 com Z., example: '2026-10-18T16:00:00Z'}
        sector: {nullable: true, allOf: [{$ref: '#/components/schemas/PublicSpace'}]}
        state: {type: string, enum: [ended, live, upcoming, scheduled], description: 'Prioridade: ended; live; upcoming quando 0 < startsAt-generatedAt <= 15 minutos; scheduled nos demais casos, inclusive pausa.'}
    ScheduleResponse:
      type: object
      additionalProperties: false
      required: [items, generatedAt]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ScheduleItem'}}
        generatedAt: {type: string, format: date-time, description: Relógio do servidor em UTC RFC 3339 com Z., example: '2026-10-18T14:45:00Z'}
    PublicActivity:
      type: object
      additionalProperties: false
      required: [id, space, slug, name, description, kind, startsAt, endsAt, checkInPoints, momentPoints, cooldownSeconds, allowsMoment, state]
      properties:
        id: {type: string, format: uuid}
        space: {nullable: true, allOf: [{$ref: '#/components/schemas/PublicSpace'}]}
        slug: {type: string}
        name: {type: string}
        description: {type: string, nullable: true}
        kind: {type: string, enum: [schedule, checkpoint, challenge, competitive, live]}
        startsAt: {type: string, format: date-time, nullable: true, description: Instante UTC RFC 3339 com Z; offsets aceitos nas escritas administrativas preservam o instante.}
        endsAt: {type: string, format: date-time, nullable: true, description: Instante UTC RFC 3339 com Z; offsets aceitos nas escritas administrativas preservam o instante.}
        checkInPoints: {type: integer, minimum: 0}
        momentPoints: {type: integer, minimum: 0}
        cooldownSeconds: {type: integer, minimum: 0}
        allowsMoment: {type: boolean}
        state: {type: string, nullable: true, enum: [ended, live, upcoming, scheduled]}
    PaginatedPublicActivities:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/PublicActivity'}}
        pagination: {$ref: '#/components/schemas/Pagination'}
    CreateAdminSpaceRequest:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug: {type: string, maxLength: 120, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', example: capela}
        name: {type: string, minLength: 1, maxLength: 200, example: Capela}
        mapReference: {type: string, maxLength: 1000, nullable: true, example: 'map:capela'}
    UpdateAdminSpaceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        slug: {type: string, maxLength: 120, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        name: {type: string, minLength: 1, maxLength: 200}
        mapReference: {type: string, maxLength: 1000, nullable: true}
      example: {name: Capela Central, mapReference: null}
    PaginatedSpaces:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Space'}}
        pagination: {$ref: '#/components/schemas/Pagination'}
    AdminActivity:
      type: object
      additionalProperties: false
      required: [id, spaceId, slug, name, description, kind, status, startsAt, endsAt, checkInPoints, momentPoints, cooldownSeconds, allowsMoment]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        spaceId: {type: string, format: uuid, nullable: true}
        slug: {type: string, maxLength: 120, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 4000, nullable: true}
        kind: {type: string, enum: [schedule, checkpoint, challenge, competitive, live]}
        status: {type: string, enum: [draft, active, paused, completed, archived], readOnly: true}
        startsAt: {type: string, format: date-time, nullable: true, description: Instante normalizado para UTC e serializado em RFC 3339 com Z; a exibição usa o fuso local do cliente.}
        endsAt: {type: string, format: date-time, nullable: true, description: Instante normalizado para UTC e serializado em RFC 3339 com Z; a exibição usa o fuso local do cliente.}
        checkInPoints: {type: integer, minimum: 0}
        momentPoints: {type: integer, minimum: 0}
        cooldownSeconds: {type: integer, minimum: 0}
        allowsMoment: {type: boolean}
    CreateAdminActivityRequest:
      type: object
      additionalProperties: false
      required: [slug, name, kind, checkInPoints, momentPoints, cooldownSeconds, allowsMoment]
      properties:
        spaceId: {type: string, format: uuid, nullable: true}
        slug: {type: string, maxLength: 120, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 4000, nullable: true}
        kind: {type: string, enum: [schedule, checkpoint, challenge, competitive, live]}
        startsAt: {type: string, format: date-time, nullable: true, description: Envie o instante em UTC/RFC 3339 Z; offsets válidos são normalizados para UTC.}
        endsAt: {type: string, format: date-time, nullable: true, description: Envie o instante em UTC/RFC 3339 Z; offsets válidos são normalizados para UTC.}
        checkInPoints: {type: integer, minimum: 0}
        momentPoints: {type: integer, minimum: 0}
        cooldownSeconds: {type: integer, minimum: 0}
        allowsMoment: {type: boolean}
      example:
        spaceId: 11111111-1111-4111-8111-111111111111
        slug: desafio-foto
        name: Desafio Foto
        description: Registre um momento no local.
        kind: challenge
        startsAt: '2026-08-24T18:00:00Z'
        endsAt: '2026-08-24T19:00:00Z'
        checkInPoints: 10
        momentPoints: 20
        cooldownSeconds: 60
        allowsMoment: true
    UpdateAdminActivityRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        spaceId: {type: string, format: uuid, nullable: true}
        slug: {type: string, maxLength: 120, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 4000, nullable: true}
        kind: {type: string, enum: [schedule, checkpoint, challenge, competitive, live]}
        startsAt: {type: string, format: date-time, nullable: true, description: Envie o instante em UTC/RFC 3339 Z; offsets válidos são normalizados para UTC.}
        endsAt: {type: string, format: date-time, nullable: true, description: Envie o instante em UTC/RFC 3339 Z; offsets válidos são normalizados para UTC.}
        checkInPoints: {type: integer, minimum: 0}
        momentPoints: {type: integer, minimum: 0}
        cooldownSeconds: {type: integer, minimum: 0}
        allowsMoment: {type: boolean}
        status: {type: string, enum: [archived], description: Única transição administrativa; start e pause não são aceitos aqui.}
      example: {status: archived}
    PaginatedAdminActivities:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/AdminActivity'}}
        pagination: {$ref: '#/components/schemas/Pagination'}
    AdminStaff:
      type: object
      additionalProperties: false
      required: [id, name, role, onboardingComplete]
      properties:
        id: {type: string, pattern: '^[1-9][0-9]*$'}
        name: {type: string}
        role: {type: string, enum: [EVENT_MANAGER]}
