name: Deploy Develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  deploy:
    name: Build, Test & Deploy to Develop
    environment: develop
    env:
      IMAGE_TAG: develop
      APP_MODE: release
      IMAGE_REPOSITORY_NAME: dnjtechteam/dnj-game-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: make build vet

      - name: Run race detector
        run: make test-race

      - name: Run tests with coverage
        run: make test-cover-check

      - name: Validate migrations and committed OpenAPI contracts
        run: |
          make test-migrations openapi
          git diff --exit-code -- docs/openapi

      - name: Run database migrations
        run: go run cmd/migrate/main.go
        env:
          SERVER_ENVIRONMENT: development
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Sync database configuration to Lambda
        env:
          FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables' \
            --output json > /tmp/current-lambda-environment.json
          jq \
            --arg host "$DB_HOST" \
            --arg port "$DB_PORT" \
            --arg user "$DB_USER" \
            --arg password "$DB_PASSWORD" \
            --arg name "$DB_NAME" \
            '{Variables: ((. // {}) + {DB_HOST: $host, DB_PORT: $port, DB_USER: $user, DB_PASSWORD: $password, DB_NAME: $name})}' \
            /tmp/current-lambda-environment.json > /tmp/updated-lambda-environment.json
          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --environment file:///tmp/updated-lambda-environment.json >/dev/null
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build --provenance=false \
            -t $ECR_REGISTRY/$IMAGE_REPOSITORY_NAME:$IMAGE_TAG \
            -f ./build/docker/Dockerfile \
            --build-arg APP_MODE=$APP_MODE \
            --no-cache .
          docker push $ECR_REGISTRY/$IMAGE_REPOSITORY_NAME:$IMAGE_TAG

      - name: Update Lambda
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --image-uri $ECR_REGISTRY/$IMAGE_REPOSITORY_NAME:$IMAGE_TAG

      - name: Build OpenAPI docs site
        run: ./scripts/publish-openapi-docs.sh docs/openapi/swagger.json "${{ secrets.API_BASE_URL }}" develop docs/openapi/dnj-v2.openapi.json

      - name: Publish OpenAPI docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
